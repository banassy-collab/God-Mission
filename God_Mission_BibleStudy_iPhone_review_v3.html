<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf7">
<title>God Mission · 성경공부</title>
<style>
:root{
  color-scheme:light dark;
  --bg:light-dark(#fffaf7,#171514);
  --surface:light-dark(#ffffff,#211e1c);
  --surface2:light-dark(#fff1eb,#2b2421);
  --ink:light-dark(#292725,#f7f0eb);
  --muted:light-dark(#827b76,#b9afa8);
  --line:light-dark(#eadfd9,#3b332f);
  --red:light-dark(#df4d49,#ff746e);
  --red2:light-dark(#f47b72,#ff948d);
  --green:light-dark(#657f6c,#91b39a);
  --yellow:light-dark(#f3c866,#e9bc55);
  --shadow:0 16px 40px rgba(54,34,25,.10);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
#app{min-height:100vh;background:var(--bg)}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}
.container{width:min(100%,760px);margin:0 auto;padding:0 18px}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar-inner{height:64px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;cursor:pointer}
.brand img{width:128px;height:auto;object-fit:contain}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.04em}
.top-actions{display:flex;gap:7px;align-items:center}
.icon-btn,.pill-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 12px;font-size:12px}
.icon-btn{width:38px;height:38px;padding:0}
.admin-badge{background:var(--red);color:white;border:0}
.hero{padding:24px 0 18px;position:relative;overflow:hidden}
.kicker{font-size:11px;color:var(--red);font-weight:800;letter-spacing:.12em}
h1{font-size:34px;line-height:1.12;margin:7px 0 8px;letter-spacing:-.05em}
.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:18px 0 12px}
.section-title h2{font-size:18px;margin:0;letter-spacing:-.04em}
.section-title span{font-size:11px;color:var(--muted)}
.lesson-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(50,30,20,.06);margin-bottom:14px;transition:.18s transform}
.lesson-card:active{transform:scale(.985)}
.lesson-cover{height:225px;background:var(--surface2);position:relative;overflow:hidden}
.lesson-cover img{width:100%;height:100%;object-fit:cover;display:block}
.lesson-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(20,12,10,.18))}
.lesson-info{padding:15px 16px 16px}
.lesson-top{display:flex;justify-content:space-between;gap:10px}
.lesson-num{color:var(--red);font-size:11px;font-weight:800}
.lesson-title{font-size:19px;font-weight:850;margin:4px 0;letter-spacing:-.04em}
.meta{font-size:11px;color:var(--muted)}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:13px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--yellow));border-radius:99px}
.divider{height:1px;background:var(--line);margin:22px 0}
.bottom-space{height:70px}
.navbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.nav-inner{width:min(100%,760px);margin:auto;display:flex;justify-content:space-around}
.nav-item{border:0;background:none;color:var(--muted);font-size:10px;display:flex;flex-direction:column;gap:4px;align-items:center;padding:5px 12px}
.nav-item b{font-size:19px;line-height:1}
.nav-item.active{color:var(--red)}
.reader-head{padding:15px 0 10px;display:flex;align-items:center;gap:10px}
.back{border:0;background:none;color:var(--ink);font-size:22px}
.reader-title{font-weight:850;font-size:16px}
.reader-sub{font-size:10px;color:var(--muted)}
.book-shell{padding:8px 0 18px}
.book{background:#f1e6dc;border-radius:20px;padding:10px;box-shadow:var(--shadow);position:relative;perspective:1600px;overflow:hidden}
.book-page{position:relative;background:#fffdf9;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(30,20,15,.08);cursor:zoom-in;transform-origin:left center;backface-visibility:hidden;will-change:transform,opacity,filter;transition:transform .22s ease,box-shadow .22s ease;animation:pageAppear .48s cubic-bezier(.22,.75,.25,1)}
.book-page::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(55,35,20,.14),transparent 12%,transparent 88%,rgba(55,35,20,.05));opacity:0;transition:opacity .22s ease}
.book-page img{display:block;width:100%;height:auto;-webkit-user-drag:none;user-select:none;pointer-events:none}
.book-page.turn-next{animation:bookTurnNext .62s cubic-bezier(.22,.72,.18,1)}
.book-page.turn-prev{animation:bookTurnPrev .62s cubic-bezier(.22,.72,.18,1)}
@keyframes pageAppear{0%{opacity:0;transform:translateY(10px) scale(.985);filter:blur(2px)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes bookTurnNext{0%{opacity:.55;transform:perspective(1600px) rotateY(0deg) translateX(12px) scale(.995);box-shadow:-14px 8px 24px rgba(45,25,15,.18)}18%{opacity:.92;transform:perspective(1600px) rotateY(-7deg) translateX(7px) scale(.995)}48%{opacity:1;transform:perspective(1600px) rotateY(-20deg) translateX(-2px) scale(.99);box-shadow:-24px 8px 34px rgba(45,25,15,.24)}72%{transform:perspective(1600px) rotateY(5deg) translateX(-3px) scale(1.002);box-shadow:6px 7px 22px rgba(45,25,15,.14)}100%{opacity:1;transform:perspective(1600px) rotateY(0deg) translateX(0) scale(1);box-shadow:0 4px 14px rgba(30,20,15,.08)}}
@keyframes bookTurnPrev{0%{opacity:.55;transform:perspective(1600px) rotateY(0deg) translateX(-12px) scale(.995);box-shadow:14px 8px 24px rgba(45,25,15,.18)}18%{opacity:.92;transform:perspective(1600px) rotateY(7deg) translateX(-7px) scale(.995)}48%{opacity:1;transform:perspective(1600px) rotateY(20deg) translateX(2px) scale(.99);box-shadow:24px 8px 34px rgba(45,25,15,.24)}72%{transform:perspective(1600px) rotateY(-5deg) translateX(3px) scale(1.002);box-shadow:-6px 7px 22px rgba(45,25,15,.14)}100%{opacity:1;transform:perspective(1600px) rotateY(0deg) translateX(0) scale(1);box-shadow:0 4px 14px rgba(30,20,15,.08)}}
@media (hover:hover) and (pointer:fine){.book-page:hover{transform:translateY(-3px) scale(1.008);box-shadow:0 12px 28px rgba(30,20,15,.16)}.book-page:hover::after{opacity:1}.round:hover,.primary:hover,.small-btn:hover{transform:translateY(-1px);filter:brightness(.98)}}
.book-page:active{transform:scale(.992);box-shadow:0 2px 9px rgba(30,20,15,.1)}
@keyframes fsFadeIn{from{opacity:0}to{opacity:1}}
@keyframes fsImageIn{from{opacity:0;transform:translate3d(0,10px,0) scale(.965)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}
@media (prefers-reduced-motion:reduce){.book-page,.book-page.turn-next,.book-page.turn-prev{animation:none!important;transition:none}.reader-fullscreen{animation:none!important}}
.pdf-frame{display:block;width:100%;height:min(72vh,850px);border:0;background:#fff;border-radius:12px}
.page-hint{font-size:10px;color:var(--muted);text-align:center;margin-top:7px}
.reader-fullscreen{position:fixed;inset:0;z-index:1000;background:rgba(16,13,12,.96);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden;touch-action:none;animation:fsFadeIn .28s ease-out both}
.reader-fullscreen img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transform:translate3d(0,0,0) scale(1);transform-origin:center center;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;touch-action:none;animation:fsImageIn .38s cubic-bezier(.22,.75,.25,1) both;filter:drop-shadow(0 12px 35px rgba(0,0,0,.28))}
.reader-fullscreen .fs-tip{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 12px;font-size:11px;backdrop-filter:blur(8px);pointer-events:none;white-space:nowrap}
.reader-fullscreen .fs-close{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:23px;line-height:38px}
.write-actions{display:flex;gap:9px;margin:10px 0 4px}
.write-actions button{flex:1}
.page-controls{display:flex;align-items:center;justify-content:space-between;padding:13px 4px}
.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.page-count{font-size:11px;color:var(--muted)}
.primary{border:0;background:var(--red);color:white;border-radius:14px;padding:14px 17px;font-weight:800;box-shadow:0 8px 20px rgba(223,77,73,.22)}
.cta-row{display:flex;gap:8px}.cta-row .primary{flex:1}
.response-list{display:grid;gap:10px}
.response{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px}
.response-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.name{font-weight:850;font-size:13px}
.text{font-size:13px;line-height:1.7;color:var(--ink);white-space:pre-wrap}
.response-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.heart{border:1px solid var(--line);background:var(--surface2);color:var(--red);border-radius:999px;padding:7px 11px;font-size:12px}
.heart.on{background:#ffe4df;border-color:#ffc4bc}
.my-tag{font-size:9px;color:var(--red);background:#fff0ed;padding:4px 7px;border-radius:999px}
.form-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:17px;margin:12px 0}
label{display:block;font-size:11px;color:var(--muted);margin:0 0 7px}
select,input,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;outline:none}
textarea{min-height:180px;resize:vertical;line-height:1.7}
input:focus,textarea:focus,select:focus{border-color:var(--red)}
.counter{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:7px}
.counter strong{color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(25,18,15,.48);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal-card{width:min(100%,620px);background:var(--surface);border-radius:24px 24px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.2)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.modal-head h3{margin:0;font-size:18px}
.close{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%}
.notice{background:var(--surface2);border-radius:14px;padding:11px;font-size:11px;line-height:1.55;color:var(--muted);margin:10px 0}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.admin-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px}
.admin-card b{font-size:13px}
.admin-card p{font-size:11px;color:var(--muted);line-height:1.5}
.admin-list{display:grid;gap:8px;margin-top:10px}
.member-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.member-row input{padding:8px}
.small-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 9px;font-size:10px}
.small-btn.danger{color:var(--red)}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:100;background:#26211e;color:#fff;padding:10px 14px;border-radius:999px;font-size:11px;box-shadow:0 8px 25px rgba(0,0,0,.2)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px;background:var(--bg);position:relative;overflow:hidden}
.login-card{width:min(100%,420px);background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:25px;box-shadow:var(--shadow);position:relative}
.login-logo{width:190px;display:block;margin:0 auto 10px}
.login h1{text-align:center;font-size:27px}
.login p{text-align:center;color:var(--muted);font-size:12px;line-height:1.6}
.pin-input{text-align:center;letter-spacing:.35em;font-size:23px;font-weight:800}
.login-foot{text-align:center;font-size:10px;color:var(--muted);margin-top:14px}
@media(min-width:700px){
  .container{padding:0 24px}
  .lesson-card{display:flex;height:230px}
  .lesson-cover{width:180px;height:100%}
  .lesson-info{flex:1;display:flex;flex-direction:column;justify-content:center}
  .book{padding:18px}
}
@media(max-width:390px){h1{font-size:30px}.lesson-cover{height:205px}.admin-grid{grid-template-columns:1fr}}
@media(max-width:700px){.book{padding:7px}.book-page{border-radius:10px}.reader-fullscreen img{max-width:100vw;max-height:100dvh}}
</style>
</head>

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

function countNoSpace(s){return (s||"").replace(/\s/g,"").length;}
function member(){return state.members.find(m=>String(m.id)===String(state.currentMemberId));}
function responseKey(lessonId,memberId){return lessonId+"_"+memberId;}
function heartKey(lessonId,memberId){return lessonId+"_"+memberId;}

function render(){
  const app=document.getElementById("app");
  if(!state.mode){renderLogin(app);return;}
  if(state.page==="home") renderHome(app);
  else if(state.page==="reader") renderReader(app);
  else if(state.page==="responses") renderResponses(app);

  const p=document.getElementById("entryPin").value;

}

        <div class="lesson-title">${esc(l.title)}</div>

        ${sample?'<div class="notice" style="margin:8px 0 0">현재 1과 PDF를 복제한 형식 확인용 샘플</div>':''}
        <div class="progress"><i style="width:${q}%"></i></div>
        <div class="meta" style="margin-top:7px">작성 ${d} / ${state.members.length}명 · ${q}%</div>
      </div>
    </article>`;}).join('')}
    ${state.admin?`<div class="form-card"><b>관리자 빠른 메뉴</b><p class="meta" style="margin:7px 0 12px">공과·회원·PIN을 관리할 수 있어요.</p><button class="primary" onclick="go('admin')">관리자 메뉴 열기</button></div>`:""}
    <div class="bottom-space"></div>
  </main>${bottomNav('home')}`;
}
function openLesson(id=state.lesson||1,fromWrite=false){state.lesson=Number(id);state.page="reader";state.pageIndex=0;state.returnToWrite=!!fromWrite;render();}
function renderReader(app){
  const lesson=state.lessons.find(l=>l.id===state.lesson)||state.lessons[0];
  const pages=lesson.id===1?PAGES:(lesson.pages||PAGES);
  const turn=state.pageTurnDir||"";
  state.pageTurnDir="";
  app.innerHTML=shell(`${lesson.id}과 · ${esc(lesson.title)}`,esc(lesson.subtitle||"오늘의 공과"));
  app.innerHTML+=`<main class="container">
    <section class="book-shell">
      <div class="book">
        ${lesson.pdfData?`<iframe class="pdf-frame" title="${esc(lesson.id+'과 공과 PDF')}" src="${lesson.pdfData}#toolbar=0&navpanes=0"></iframe>`:`<div class="book-page ${turn?`turn-${turn}`:''}" onclick="openReaderFullscreen()"><img src="${pages[state.pageIndex%pages.length]}" alt="공과 ${state.pageIndex+1}페이지"></div>`}
      </div>
      ${lesson.pdfData?`<div class="notice">업로드한 PDF를 보고 있어요. 아래 관리자 메뉴에서 PDF를 페이지 이미지로 변환해 올리면 확대·책넘김 기능을 사용할 수 있어요.</div>`:`<div class="page-hint">공과 페이지를 누르면 크게 볼 수 있어요 · 두 손가락으로 확대/축소</div><div class="page-controls"><button class="round" onclick="prevPage()">‹</button><span class="page-count">${state.pageIndex+1} / ${pages.length}</span><button class="round" onclick="nextPage()">›</button></div>`}
      <div class="cta-row">
        <button class="primary" onclick="go('responses')">♡ 우리들의 이야기</button>
        <button class="primary" onclick="go('write')">✎ 내 기록</button>
      </div>
      ${state.returnToWrite?`<button class="small-btn" style="width:100%;margin-top:10px" onclick="returnToWriting()">← 작성창으로 돌아가기</button>`:''}
    </section>
    <div class="notice">휴대폰에서는 좌우로 넘기거나 아래 화살표를 눌러 페이지를 볼 수 있어요.</div>
    <div class="bottom-space"></div>
  </main>${bottomNav('')}`;
}
function prevPage(){if(state.pageIndex>0){state.pageIndex--;state.pageTurnDir="prev";render();}}
function nextPage(){const l=state.lessons.find(x=>x.id===state.lesson)||state.lessons[0];const pages=l.id===1?PAGES:(l.pages||PAGES);if(state.pageIndex<pages.length-1){state.pageIndex++;state.pageTurnDir="next";render();}}
function returnToWriting(){state.page="write";state.returnToWrite=false;render();}

let fsScale=1,fsX=0,fsY=0,fsStartX=0,fsStartY=0,fsStartDist=0,fsStartScale=1,fsMoved=false,fsSingleStart=0;
function openReaderFullscreen(){
  if(state.page!=="reader")return;
  const lesson=state.lessons.find(l=>l.id===state.lesson)||state.lessons[0];
  const pages=lesson.id===1?PAGES:(lesson.pages||PAGES);
  const src=pages[state.pageIndex%pages.length];
  const old=document.getElementById("readerFullscreen");
  if(old)old.remove();
  const ov=document.createElement("div");ov.id="readerFullscreen";ov.className="reader-fullscreen";
  ov.innerHTML=`<div class="fs-tip">두 손가락으로 확대 · 축소 · 이동</div><button class="fs-close" aria-label="닫기">×</button><img src="${src}" alt="공과 ${state.pageIndex+1}페이지 크게 보기">`;
  document.body.appendChild(ov);
  fsScale=1;fsX=0;fsY=0;fsMoved=false;fsSingleStart=0;
  const img=ov.querySelector("img");
  const apply=()=>{img.style.transform=`translate3d(${fsX}px,${fsY}px,0) scale(${fsScale})`;};
  const dist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  ov.querySelector(".fs-close").addEventListener("click",e=>{e.stopPropagation();ov.remove();});
  ov.addEventListener("click",e=>{if(e.target===ov && !fsMoved)ov.remove();});
  ov.addEventListener("touchstart",e=>{
    if(e.touches.length===2){
      fsMoved=true;fsStartDist=dist(e.touches[0],e.touches[1]);fsStartScale=fsScale;
      const midX=(e.touches[0].clientX+e.touches[1].clientX)/2,midY=(e.touches[0].clientY+e.touches[1].clientY)/2;
      fsStartX=fsX;fsStartY=fsY;
    }else if(e.touches.length===1){
      fsSingleStart=Date.now();fsStartX=e.touches[0].clientX-fsX;fsStartY=e.touches[0].clientY-fsY;fsMoved=false;
    }
  },{passive:false});
  ov.addEventListener("touchmove",e=>{
    e.preventDefault();
    if(e.touches.length===2){
      fsMoved=true;
      const d=dist(e.touches[0],e.touches[1]);
      fsScale=Math.min(4,Math.max(1,d/fsStartDist*fsStartScale));
      apply();
    }else if(e.touches.length===1 && fsScale>1){
      const dx=e.touches[0].clientX-fsStartX,dy=e.touches[0].clientY-fsStartY;
      if(Math.abs(dx-fsX)>4||Math.abs(dy-fsY)>4)fsMoved=true;
      fsX=dx;fsY=dy;apply();
    }
  },{passive:false});
  ov.addEventListener("touchend",e=>{
    if(e.touches.length===0 && fsScale<=1.02 && !fsMoved && Date.now()-fsSingleStart<500)ov.remove();
  });
}
let touchX=0;
document.addEventListener("touchstart",e=>{if(state.page==="reader" && !e.target.closest(".reader-fullscreen"))touchX=e.changedTouches[0].screenX},{passive:true});
document.addEventListener("touchend",e=>{if(state.page!=="reader"||document.getElementById("readerFullscreen")||e.target.closest(".reader-fullscreen"))return;let dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>45){if(dx<0)nextPage();else prevPage();}});

function renderResponses(app){
  const rows=state.members.map(m=>{
    const r=state.responses[responseKey(state.lesson,m.id)];
    if(!r)return "";
    const hk=heartKey(state.lesson,m.id);
    const list=state.hearts[hk]||[];
    const liked=state.currentMemberId && list.includes(String(state.currentMemberId));
    const own=String(m.id)===String(state.currentMemberId);
    return `<article class="response">
      <div class="response-head"><span class="name">${esc(m.name)}</span>${own?'<span class="my-tag">내 기록</span>':''}</div>
      <div class="text">${esc(r)}</div>
      <div class="response-foot"><span class="meta">${r.replace(/\\s/g,"").length}자</span><button class="heart ${liked?'on':''}" onclick="toggleHeart(${m.id})">${liked?'♥':'♡'} ${list.length}</button></div>
    </article>`;
  }).join("");
  app.innerHTML=shell("우리들의 이야기",`${state.lesson}과 · 서로의 생각을 읽고 마음을 보내요.`);
  app.innerHTML+=`<main class="container">
    <div class="section-title"><h2>요약 & 느낀점</h2><span>${state.members.filter(m=>state.responses[responseKey(state.lesson,m.id)]).length}/${state.members.length} 작성</span></div>
    <div class="response-list">${rows||`<div class="form-card"><b>아직 작성된 이야기가 없어요.</b><p class="meta">첫 번째 이야기를 남겨보세요.</p></div>`}</div>
    <button class="primary" style="width:100%;margin:16px 0 80px" onclick="go('write')">✎ 내 의견 작성하기</button>
  </main>${bottomNav('responses')}`;
}
function toggleHeart(memberId){
  if(!state.currentMemberId){toast("먼저 이름을 확인해주세요.");openMemberModal();return;}
  if(String(memberId)===String(state.currentMemberId)){toast("내 의견에는 하트를 누를 수 없어요.");return;}
  const k=heartKey(state.lesson,memberId);state.hearts[k]=state.hearts[k]||[];
  const me=String(state.currentMemberId);const i=state.hearts[k].indexOf(me);
  if(i>=0)state.hearts[k].splice(i,1);else state.hearts[k].push(me);
  save();render();
}
function go(page){state.page=page;render();if(page==="write"&&!member())setTimeout(openMemberModal,80);}

function renderWrite(app){
  const m=member();
  app.innerHTML=shell("내 기록",`${state.lesson}과 · 나의 요약 & 느낀점`);
  if(!m){
    app.innerHTML+=`<main class="container"><div class="form-card"><b>먼저 내 이름을 확인해주세요.</b><p class="meta">이름을 선택하고 개인 PIN으로 본인임을 확인하면 작성할 수 있어요.</p><button class="primary" onclick="openMemberModal()">이름 확인하기</button></div></main>${bottomNav('write')}`;
    return;
  }
  const k=responseKey(state.lesson,m.id);const old=state.responses[k]||"";
  app.innerHTML+=`<main class="container">
    <div class="form-card">
      <div class="section-title" style="margin-top:0"><h2>${esc(m.name)}님의 기록</h2><span>${state.lesson}과</span></div>
      <label>요약 & 느낀점</label>
      <textarea id="responseText" maxlength="1000" placeholder="오늘 공과를 통해 느낀 점과 적용할 점을 적어주세요.">${esc(state.draftText!==undefined?state.draftText:old)}</textarea>
      <div class="counter"><span>띄어쓰기 제외 100자 이상</span><strong id="count">${countNoSpace(state.draftText!==undefined?state.draftText:old)} / 100자</strong></div>
      <div class="write-actions"><button class="small-btn" onclick="viewLessonFromWrite()">오늘의 공과 보기</button><button class="primary" onclick="saveResponse()">저장하기</button></div>
    </div>
    <div class="notice">띄어쓰기 제외 100자 이상 작성하면 저장할 수 있어요. 작성 중 공과를 확인한 뒤 다시 돌아올 수 있습니다.</div>
    <div class="bottom-space"></div>
  </main>${bottomNav('write')}`;
  document.getElementById("responseText").addEventListener("input",e=>{state.draftText=e.target.value;document.getElementById("count").textContent=countNoSpace(e.target.value)+" / 100자";});
}
function viewLessonFromWrite(){state.draftText=document.getElementById("responseText")?.value||"";openLesson(state.lesson,true);}
 function saveResponse(){
  const t=document.getElementById("responseText").value;const n=countNoSpace(t);
  if(n<100){toast("띄어쓰기 제외 100자 이상으로 작성해주세요.");return;}
  state.responses[responseKey(state.lesson,state.currentMemberId)]=t;state.draftText=undefined;save();toast("기록이 저장됐어요.");render();
}
function openMemberModal(){
  const opts=state.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("");
  const modal=document.createElement("div");modal.className="modal";modal.id="memberModal";
  modal.innerHTML=`<div class="modal-card">
    <div class="modal-head"><h3>내 이름 확인</h3><button class="close" onclick="closeModal()">×</button></div>
    <label>이름</label><select id="memberSelect">${opts}</select>
    <div class="notice">처음이라면 개인 PIN 4자리를 설정해요. 이후에는 같은 PIN으로 내 의견을 작성·수정할 수 있어요.</div>
    <label>개인 PIN 4자리</label><input id="memberPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    <button class="primary" style="width:100%;margin-top:13px" onclick="confirmMember()">확인하기</button>
  </div>`;
  document.body.appendChild(modal);
}
function closeModal(){document.getElementById("memberModal")?.remove();}
function confirmMember(){
  const id=document.getElementById("memberSelect").value;const pin=document.getElementById("memberPin").value;const m=state.members.find(x=>String(x.id)===String(id));
  if(!m||!/^\d{4}$/.test(pin)){toast("4자리 숫자를 입력해주세요.");return;}
  if(!m.pin){m.pin=pin;toast("개인 PIN이 설정됐어요.");}
  else if(m.pin!==pin){toast("개인 PIN이 맞지 않아요.");return;}
  state.currentMemberId=String(m.id);localStorage.setItem("gm_current_member",state.currentMemberId);save();closeModal();render();
}
function logout(){state.mode=null;state.admin=false;state.currentMemberId="";localStorage.removeItem("gm_current_member");render();}

function renderAdmin(app){
  app.innerHTML=shell("관리자 센터","관리자 PIN으로 들어온 경우에만 보여요.");
  const done=state.members.filter(m=>state.responses[responseKey(state.lesson,m.id)]).length;
  app.innerHTML+=`<main class="container">
    <div class="admin-grid">
      <div class="admin-card"><b>회원</b><p>${state.members.length}명 · 관리자에서 자유롭게 추가/삭제</p></div>
      <div class="admin-card"><b>${state.lesson}과 작성</b><p>${done} / ${state.members.length}명</p></div>
    </div>
    <div class="form-card">
      <div class="section-title" style="margin-top:0"><h2>공동체 PIN</h2><span>일반 입장</span></div>
      <input id="communityPin" inputmode="numeric" maxlength="4" value="${esc(state.settings.communityPin)}">
      <button class="small-btn" style="margin-top:9px" onclick="changeSetting('communityPin')">변경</button>
    </div>
    <div class="form-card">
      <div class="section-title" style="margin-top:0"><h2>대표 관리자 PIN</h2><span>관리자 입장</span></div>
      <input id="adminPin" inputmode="numeric" maxlength="4" value="${esc(state.settings.adminPin)}">
      <button class="small-btn" style="margin-top:9px" onclick="changeSetting('adminPin')">변경</button>
    </div>
    <div class="form-card">
      <div class="section-title" style="margin-top:0"><h2>회원 관리</h2><span>${state.members.length}명</span></div>
      <div class="admin-list">${state.members.map(m=>`<div class="member-row"><input id="name_${m.id}" value="${esc(m.name)}" aria-label="회원 이름"><span style="display:flex;gap:5px"><button class="small-btn" onclick="renameMember(${m.id})">저장</button><button class="small-btn" onclick="resetMemberPin(${m.id})">PIN초기화</button><button class="small-btn danger" onclick="removeMember(${m.id})">삭제</button></span></div>`).join("")}</div>
      <button class="primary" style="width:100%;margin-top:12px" onclick="addMember()">+ 회원 추가</button>
    </div>
    <div class="form-card">
      <div class="section-title" style="margin-top:0"><h2>공과 / PDF 관리</h2><span>${state.lessons.length}개 과</span></div>
      <label>수정할 공과 선택</label><select id="lessonSelect" onchange="selectAdminLesson()">${state.lessons.map(l=>`<option value="${l.id}" ${l.id===state.lesson?'selected':''}>${l.id}과 · ${esc(l.title)}</option>`).join('')}</select>
      <label style="margin-top:10px">공과 제목</label><input id="lessonTitle" value="${esc((state.lessons.find(l=>l.id===state.lesson)||state.lessons[0]).title)}">
      <label style="margin-top:10px">설명</label><input id="lessonSubtitle" value="${esc((state.lessons.find(l=>l.id===state.lesson)||state.lessons[0]).subtitle||'')}" />
      <button class="small-btn" style="margin-top:9px" onclick="saveLessonInfo()">제목/설명 저장</button>
      <div class="divider"></div>
      <p class="meta">선택한 과의 PDF를 새 파일로 교체할 수 있어요. 교체 후 이 브라우저에서는 PDF가 바로 열립니다. 2·3과는 현재 1과 페이지를 복제한 샘플입니다.</p>
      <input type="file" accept="application/pdf" id="pdfUpload">
      <button class="primary" style="width:100%;margin-top:9px" onclick="uploadLessonPdf()">PDF 업로드 / 교체</button>
      <button class="small-btn" style="margin-top:9px" onclick="addLesson()">+ 공과 추가</button>
    </div>
    <div class="notice">※ 현재 HTML 데모는 브라우저의 localStorage를 사용합니다. 따라서 이 상태에서는 휴대폰 A에서 작성한 내용이 휴대폰 B와 공유되지 않습니다. 실제 공동체 운영에서는 Supabase/Firebase 같은 서버 데이터베이스를 연결해야 합니다.</div>
    <div class="bottom-space"></div>
  </main>${bottomNav('admin')}`;
}
function changeSetting(key){
  const id=key==="communityPin"?"communityPin":"adminPin";const v=document.getElementById(id).value;
  if(!/^\d{4}$/.test(v)){toast("4자리 숫자로 입력해주세요.");return;}
  state.settings[key]=v;save();toast("PIN이 변경됐어요.");render();
}
function renameMember(id){const m=state.members.find(x=>x.id===id);const v=document.getElementById("name_"+id).value.trim();if(!v){toast("이름을 입력해주세요.");return;}m.name=v;save();toast("이름이 저장됐어요.");render();}
function resetMemberPin(id){const m=state.members.find(x=>x.id===id);m.pin="";save();toast(m.name+"님의 개인 PIN을 초기화했어요.");render();}
function removeMember(id){if(!confirm("이 회원을 삭제할까요?"))return;state.members=state.members.filter(x=>x.id!==id);save();render();}
function addMember(){const next=state.members.length?Math.max(...state.members.map(m=>m.id))+1:1;state.members.push({id:next,name:"새 회원",pin:""});save();render();toast("회원을 추가했어요.");}
function selectAdminLesson(){state.lesson=Number(document.getElementById("lessonSelect").value);render();}
function saveLessonInfo(){const l=state.lessons.find(x=>x.id===state.lesson);if(!l)return;l.title=document.getElementById("lessonTitle").value.trim()||`${l.id}과`;l.subtitle=document.getElementById("lessonSubtitle").value.trim();save();render();toast("공과 정보를 저장했어요.");}
function addLesson(){const id=state.lessons.length?Math.max(...state.lessons.map(l=>l.id))+1:1;state.lessons.push({id,title:`${id}과 · 새 공과`,subtitle:"공과 설명을 입력해주세요.",pages:null,pdfData:""});state.lesson=id;save();render();toast("새 공과를 추가했어요.");}
function uploadLessonPdf(){const f=document.getElementById("pdfUpload").files[0];if(!f){toast("먼저 PDF 파일을 선택해주세요.");return;}if(f.type!=="application/pdf"&&!f.name.toLowerCase().endsWith(".pdf")){toast("PDF 파일만 업로드할 수 있어요.");return;}const reader=new FileReader();reader.onload=()=>{try{const l=state.lessons.find(x=>x.id===state.lesson);l.pdfData=reader.result;l.pdfName=f.name;save();toast(`${l.id}과 PDF를 교체했어요.`);render();}catch(e){toast("파일이 너무 커서 브라우저 저장공간을 초과했어요. 더 작은 PDF로 시도해주세요.");}};reader.readAsDataURL(f);}

render();
</script>
